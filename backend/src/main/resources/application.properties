# Furniture Hub – Backend Configuration
# ────────────────────────────────────────
# Update the DB credentials before running!

spring.application.name=furniture-backend
server.port=8080

# ── MySQL ──
spring.datasource.url=jdbc:mysql://localhost:3306/furniture_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Aravind@123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ──
app.jwt.secret=FurnitureHubSuperSecretKeyForJWT2026MustBe256BitsOrMore!
app.jwt.expiration-ms=3600000

# ── CORS (allow Vite dev server) ──
app.cors.allowed-origins=http://localhost:5173
