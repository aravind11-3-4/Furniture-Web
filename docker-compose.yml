services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: furniture-backend
    ports:
      - "8081:8080"
    env_file:
      - ./backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/furniture_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: furniture-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped